[build-system]
requires = ["setuptools>=70.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "put-asunder"
version = "0.3.0"
description = "Asunder: Constrained Network Structure Detection on Undirected Graphs."
readme = "README.md"
license = "BSD-3-Clause"
authors = [{ name = "Allman Group", email = "allmanaa@umich.edu" }, { name = "Fortune Adekogbe", email = "fortunea@umich.edu" }]
requires-python = ">=3.10,<3.15"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.13",
  "networkx>=3.2",
  "scikit-learn>=1.5",
  "scikit-network>=0.33",
  "tqdm>=4.66",
  "pyomo>=6.8",
  "gurobipy>=11.0",
  "metis>=0.2a5",
]
keywords = ["graph", "constrained-clustering", "graph-clustering", "community-detection", "core-periphery", "column-generation", "constrained-network-structure-detection", "branch-and-price"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
graph = ["python-igraph>=0.11", "leidenalg>=0.10"]
viz = ["matplotlib>=3.8", "seaborn>=0.13"]
legacy = ["cpnet"]
docs = [
  "sphinx>=7.4",
  "furo>=2024.8.6",
  "myst-parser>=3.0",
  "sphinx-autodoc-typehints>=2.3",
]
dev = [
  "build>=1.2",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.12",
  "pre-commit>=3.8",
]

[project.urls]
Homepage = "https://github.com/Allman-PSE-Research-Team/Asunder"
Documentation = "https://asunder.readthedocs.io/"
Repository = "https://github.com/Allman-PSE-Research-Team/Asunder"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["asunder*"]

[tool.setuptools.package-data]
"asunder.load_balancing.algorithms" = ["_qmetis_assets.json"]
"asunder.load_balancing.algorithms._native" = [
  "qmetis.dll",
  "libqmetis.dylib",
  "libqmetis.so",
  "QMETIS-LICENSE",
  "QMETIS-BUILD-INFO.txt",
  "_qmetis_bundle.json",
]

[tool.setuptools.exclude-package-data]
"asunder.load_balancing.algorithms._native" = [
  "metis.dll",
  "libmetis.dylib",
  "libmetis.so",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "legacy: tests that require best-effort legacy dependencies",
  "native: tests that require a bundled QMETIS native library",
  "solver: tests that require an available Pyomo solver backend",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E741", "B", "UP"]
